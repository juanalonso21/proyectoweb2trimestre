<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenadores Personalizados - Construye tu PC Ideal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
     <link rel="stylesheet" href="css/personalizados.css">
</head>
<body>

    <!-- Sección del título con imagen de fondo -->
    <section class="title-section">
        <div class="container">
            <h1>Ordenadores Personalizados</h1>
            <p>Construye tu PC ideal con nosotros. Ofrecemos componentes de alta calidad y un servicio de montaje profesional para garantizar el mejor rendimiento.</p>
        </div>
    </section>

    <!-- Carrusel de imágenes -->
    <section class="carousel-section">
        <div class="container">
            <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <!-- Imagen 1 -->
                    <div class="carousel-item active">
                        <img src="../../../../static/img/ordenador2.jpg" class="d-block w-100" alt="Ordenador personalizado 1">
                    </div>
                    <!-- Imagen 2 -->
                    <div class="carousel-item">
                        <img src="../../../../static/img/ordenador1.jpeg" class="d-block w-100" alt="Ordenador personalizado 2">
                    </div>
                    <!-- Imagen 3 -->
                    <div class="carousel-item">
                        <img src="../../../../static/img/placabase.jpg" class="d-block w-100" alt="Ordenador personalizado 3">
                    </div>
                </div>
                <!-- Controles del carrusel -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
