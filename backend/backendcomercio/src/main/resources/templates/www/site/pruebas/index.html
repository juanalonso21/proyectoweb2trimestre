<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda WooCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header>

    </header>

    <main>
        <section id="carouselExample" class="carousel slide" data-bs-ride="carousel">
            <section class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../../../../static/img/ordenador1.jpeg" class="d-block w-100" alt="Producto 1">
                </div>
                <div class="carousel-item">
                    <img src="../../../../static/img/placabase.jpg" class="d-block w-100" alt="Producto 2">
                </div>
            </section>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">

            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>

            <section class="container mt-5">
                <h2 class="text-center">Nuestras especialidades</h2>
                <div class="row">
                    <div class="col-md-4">
                        <a href="mantenimiento.html" class="text-decoration-none">

                                    <h5 class="card-title">Mantenimiento</h5>

                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="montaje.html" class="text-decoration-none">
                            <div class="card">

                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="personalizacion.html" class="text-decoration-none">
                            <div class="card">
                                <img src="../../../../static/img/ordenador2.jpg" class="card-img-top" alt="Personalización">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Personalización</h5>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
