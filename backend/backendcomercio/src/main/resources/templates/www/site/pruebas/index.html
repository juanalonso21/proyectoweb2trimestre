<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda WooCommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <!-- Enlace con logo -->
                <a class="navbar-brand" href="#">
                    <img src="ruta/a/tu/logo.png" alt="Logo de la tienda" class="logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link a-color" href="#">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link a-color" href="tienda.html">Tienda</a></li>
                        <li class="nav-item"><a class="nav-link a-color" href="contacto.html">Contacto</a></li>
                        <li class="nav-item">
                            <a class="nav-link a-color" href="carrito.html">
                                <i class="bi bi-cart cart-icon"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="carouselExample" class="carousel slide" data-bs-ride="carousel">
            <section class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../../../../static/img/ordenador1.jpeg" class="d-block w-100" alt="Producto 1">
                </div>
                <div class="carousel-item">
                    <img src="../../../../static/img/placabase.jpg" class="d-block w-100" alt="Producto 2">
                </div>
            </section>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>

            <section class="container mt-5">
                <h2 class="text-center">Nuestras especialidades</h2>
                <div class="row">
                    <div class="col-md-4">
                        <a href="mantenimiento.html" class="text-decoration-none">
                            <div class="card">
                                <img src="../../../../static/img/ordenador1.jpeg" class="card-img-top" alt="Mantenimiento">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Mantenimiento</h5>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="montaje.html" class="text-decoration-none">
                            <div class="card">
                                <img src="../../../../static/img/placabase.jpg" class="card-img-top" alt="Montaje">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Montaje</h5>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-md-4">
                        <a href="personalizacion.html" class="text-decoration-none">
                            <div class="card">
                                <img src="../../../../static/img/ordenador2.jpg" class="card-img-top" alt="Personalización">
                                <div class="card-body text-center">
                                    <h5 class="card-title">Personalización</h5>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <footer class="text-center py-4 mt-5 footer-container">
        <!-- Columna del logo -->
        <section class="footer-column">
            <a href="#">
                <img src="ruta/a/tu/logo-footer.png" alt="Logo de la tienda" class="footer-logo">
            </a>
        </section>
    
        <!-- Columna de redes sociales -->
        <section class="footer-column">
            <h3>Síguenos</h3>
            <ul class="list-inline">
                <!-- Iconos con enlaces -->
                <li class="list-inline-item">
                    <a href="https://facebook.com" target="_blank" class="social-icon">
                        <i class="bi bi-facebook"></i>
                    </a>
                </li>
                <li class="list-inline-item">
                    <a href="https://twitter.com" target="_blank" class="social-icon">
                        <i class="bi bi-twitter"></i>
                    </a>
                </li>
                <li class="list-inline-item">
                    <a href="https://instagram.com" target="_blank" class="social-icon">
                        <i class="bi bi-instagram"></i>
                    </a>
                </li>
                <li class="list-inline-item">
                    <a href="https://github.com" target="_blank" class="social-icon">
                        <i class="bi bi-github"></i>
                    </a>
                </li>
                <li class="list-inline-item">
                    <a href="https://linkedin.com" target="_blank" class="social-icon">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </li>
                <li class="list-inline-item">
                    <a href="https://youtube.com" target="_blank" class="social-icon">
                        <i class="bi bi-youtube"></i>
                    </a>
                </li>
            </ul>
        </section>
    
        <!-- Columna de políticas de privacidad -->
        <section class="footer-column">
            <h4>Políticas de privacidad</h4>
            <ul class="privacy-links">
                <li><a href="/politica-privacidad">Política de Privacidad</a></li>
                <li><a href="/terminos-condiciones">Términos y Condiciones</a></li>
                <li><a href="/politica-cookies">Política de Cookies</a></li>
                <li><a href="/aviso-legal">Aviso Legal</a></li>
            </ul>
        </section>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
